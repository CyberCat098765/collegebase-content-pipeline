[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "collegebase-content-pipeline"
version = "0.1.0"
description = "CLI ingestion pipeline for CollegeBase admissions content."
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "praw>=8.0.2,<9",
    "PyYAML>=6.0.1",
    "rapidfuzz>=3.14.5,<4",
    "readability-lxml>=0.8.1",
    "requests>=2.31.0",
    "scikit-learn>=1.5,<2",
    "trafilatura>=1.9.0",
    "yt-dlp>=2025.1.15",
    "youtube-transcript-api>=0.6.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.pytest_runtime -p no:cacheprovider"
