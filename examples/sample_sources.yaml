sources:
  reddit:
    subreddits: []
    keywords: []
    urls: []
    limit_per_query: 10
    max_comments: 20
    request_timeout_seconds: 5
    max_rate_limit_sleep_seconds: 3

  youtube:
    videos: []
    request_timeout_seconds: 5

  articles:
    urls: []
    request_timeout_seconds: 5

  official:
    college_scorecard:
      enabled: false
      schools:
        - "Yale University"
        - "University of North Carolina at Chapel Hill"

processing:
  chunk_max_chars: 1200

run:
  max_runtime_minutes: 30
  max_sources_total: 25
  max_chunks_total: 300
  max_failures_total: 20
  request_delay_seconds: 0
  timeout_seconds: 20
  retries_per_source: 1
  checkpoint_every_n_sources: 5
  runtime_dir: "data/runtime"
